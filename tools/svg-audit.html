<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>SVG Audit</title>
<style>
  body { background: #22223B; color: #F2E9E4; font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 24px; }
  h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
  p { color: #9A8C98; font-size: 13px; margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .item { background: #2C2E4A; border-radius: 14px; padding: 12px; }
  .icon { background: #22223B; border-radius: 10px; aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; }
  .icon svg { width: 100%; height: 100%; display: block; }
  .label { margin-top: 8px; font-size: 12px; font-weight: 600; }
  .meta { margin-top: 2px; font-size: 11px; color: #9A8C98; }
</style>
</head>
<body>
  <h1>SVG-Audit — alle Übungen</h1>
  <p>Stand: jede Übung in 1:1, Container exakt so wie in der App (#22223B Hintergrund, 12px radius).</p>
  <div class="grid" id="grid"></div>
  <script src="../exercises.js"></script>
  <script>
    const grid = document.getElementById("grid");
    for (const [id, ex] of Object.entries(EXERCISES)) {
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <div class="icon">${ex.svg}</div>
        <div class="label">${ex.name}</div>
        <div class="meta">${id} — ${ex.target}</div>
      `;
      grid.appendChild(div);
    }
  </script>
</body>
</html>
